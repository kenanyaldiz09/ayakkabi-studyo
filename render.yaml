services:
  - type: web
    name: ayakkabi-studyo
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 900
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PHOTOROOM_API_KEY
        sync: false
